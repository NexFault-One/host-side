<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexFault | Engineering Reliability</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-slide { animation: slideIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade { animation: fadeIn 0.2s ease-out forwards; }
        body { background-color: #f1f5f9; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Added new icons for the modal (BarChart2, FileJson, FileSpreadsheet, Terminal, Download)
        const { Cpu, Menu, X, Mail, Lock, Activity, ArrowRight, ArrowLeft, AlertCircle, CheckCircle, XCircle, Clock, Search, LogOut, FileText, Settings, Save, Plus, Trash2, BarChart2, FileJson, FileSpreadsheet, Terminal, Download } = {
            Cpu: () => <i data-lucide="cpu" className="w-5 h-5"></i>,
            Menu: () => <i data-lucide="menu" className="w-5 h-5"></i>,
            X: () => <i data-lucide="x" className="w-5 h-5"></i>,
            Mail: () => <i data-lucide="mail" className="w-4 h-4"></i>,
            Lock: () => <i data-lucide="lock" className="w-4 h-4"></i>,
            Activity: () => <i data-lucide="activity" className="w-5 h-5"></i>,
            ArrowRight: () => <i data-lucide="arrow-right" className="w-4 h-4"></i>,
            ArrowLeft: () => <i data-lucide="arrow-left" className="w-4 h-4"></i>,
            AlertCircle: () => <i data-lucide="alert-circle" className="w-3 h-3"></i>,
            CheckCircle: () => <i data-lucide="check-circle" className="w-4 h-4 text-teal-500"></i>,
            XCircle: () => <i data-lucide="x-circle" className="w-4 h-4 text-red-500"></i>,
            Clock: () => <i data-lucide="clock" className="w-4 h-4 text-slate-400"></i>,
            Search: () => <i data-lucide="search" className="w-4 h-4"></i>,
            LogOut: () => <i data-lucide="log-out" className="w-4 h-4"></i>,
            FileText: () => <i data-lucide="file-text" className="w-4 h-4"></i>,
            Settings: () => <i data-lucide="settings" className="w-4 h-4"></i>,
            Save: () => <i data-lucide="save" className="w-4 h-4"></i>,
            Plus: () => <i data-lucide="plus" className="w-4 h-4"></i>,
            Trash2: () => <i data-lucide="trash-2" className="w-4 h-4"></i>,
            BarChart2: () => <i data-lucide="bar-chart-2" className="w-4 h-4"></i>,
            FileJson: () => <i data-lucide="file-json" className="w-6 h-6"></i>,
            FileSpreadsheet: () => <i data-lucide="file-spreadsheet" className="w-6 h-6"></i>,
            Terminal: () => <i data-lucide="terminal" className="w-4 h-4"></i>,
            Download: () => <i data-lucide="download" className="w-4 h-4"></i>
        };

        const API_BASE_URL = 'http://127.0.0.1:8000';

        // ==========================================
        // RUN DETAILS MODAL (NEW)
        // ==========================================
        const RunDetailsModal = ({ run, auth, onClose }) => {
            const [activeTab, setActiveTab] = React.useState('dashboard');
            const [logs, setLogs] = React.useState([]);
            const [logsLoading, setLogsLoading] = React.useState(false);
            const [logsError, setLogsError] = React.useState(null);

            React.useEffect(() => { lucide.createIcons(); }, [activeTab, logs]);

            const buildBasicAuthHeaders = () => {
                if (!auth?.email || !auth?.password) return {};
                return {
                    Authorization: `Basic ${btoa(`${auth.email}:${auth.password}`)}`
                };
            };

            const prettyEnum = (value, prefix) => {
                if (!value) return '';
                return String(value).replace(prefix, '').replaceAll('_', ' ');
            };

            const prettyTimestamp = (value) => {
                if (!value) return '';
                const d = new Date(value);
                return Number.isNaN(d.getTime()) ? value : d.toLocaleString();
            };

            React.useEffect(() => {
                if (!run) return;

                const loadLogs = async () => {
                    setLogsLoading(true);
                    setLogsError(null);
                    try {
                        const response = await fetch(
                            `${API_BASE_URL}/profiles/${encodeURIComponent(run.profile_name)}/tests/${encodeURIComponent(run.test_name)}`,
                            {
                                headers: {
                                    ...buildBasicAuthHeaders(),
                                },
                            }
                        );

                        const data = await response.json();

                        if (!response.ok) {
                            throw new Error(data.detail || 'Failed to load run logs');
                        }

                        setLogs(data);
                    } catch (err) {
                        setLogsError(err.message || 'Failed to load run logs');
                    } finally {
                        setLogsLoading(false);
                    }
                };

                loadLogs();
            }, [run]);

            const handleDownload = async (format) => {
                try {
                    const response = await fetch(
                        `${API_BASE_URL}/profiles/${encodeURIComponent(run.profile_name)}/tests/${encodeURIComponent(run.test_name)}/export?format=${format}`,
                        {
                            headers: {
                                ...buildBasicAuthHeaders(),
                            },
                        }
                    );

                    if (!response.ok) {
                        let detail = 'Export failed';
                        try {
                            const err = await response.json();
                            detail = err.detail || detail;
                        } catch (_) {}
                        throw new Error(detail);
                    }

                    const blob = await response.blob();
                    const blobUrl = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = blobUrl;
                    a.download = `${run.test_name}.${format}`;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    URL.revokeObjectURL(blobUrl);
                } catch (err) {
                    alert(err.message || 'Export failed');
                }
            };

            return (
                <div className="fixed inset-0 bg-slate-900/60 z-[100] backdrop-blur-sm flex items-center justify-center p-4 md:p-8 animate-fade">
                    <div className="bg-white rounded-2xl shadow-2xl max-w-5xl w-full h-[85vh] flex flex-col overflow-hidden animate-slide">
                        <div className="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-800 text-white shrink-0">
                            <div className="flex items-center gap-3">
                                <Activity className="text-teal-400" />
                                <div>
                                    <h2 className="text-lg font-bold tracking-tight">{run.profile_name}</h2>
                                    <p className="text-[10px] font-mono text-slate-400 uppercase tracking-widest">
                                        Test Name: {run.test_name}
                                    </p>
                                </div>
                            </div>
                            <button onClick={onClose} className="p-2 text-slate-400 hover:text-white hover:bg-slate-700 rounded-lg transition-colors">
                                <X />
                            </button>
                        </div>

                        <div className="flex px-6 bg-slate-50 border-b border-slate-200 shrink-0">
                            <button
                                onClick={() => setActiveTab('dashboard')}
                                className={`px-4 py-3 text-sm font-bold flex items-center gap-2 border-b-2 transition-colors ${
                                    activeTab === 'dashboard'
                                        ? 'border-teal-500 text-teal-600'
                                        : 'border-transparent text-slate-500 hover:text-slate-800'
                                }`}
                            >
                                <BarChart2 /> Dashboard View
                            </button>
                            <button
                                onClick={() => setActiveTab('export')}
                                className={`px-4 py-3 text-sm font-bold flex items-center gap-2 border-b-2 transition-colors ${
                                    activeTab === 'export'
                                        ? 'border-teal-500 text-teal-600'
                                        : 'border-transparent text-slate-500 hover:text-slate-800'
                                }`}
                            >
                                <Download /> Export Data
                            </button>
                        </div>

                        <div className="flex-1 overflow-y-auto bg-slate-100 p-6">
                            {activeTab === 'dashboard' && (
                                <div className="space-y-6 animate-slide">
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                        <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                                            <div className="text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-1">Verdict</div>
                                            <div className={`text-lg font-black ${
                                                run.verdict === 'VERDICT_PASS'
                                                    ? 'text-teal-600'
                                                    : run.verdict === 'VERDICT_FAIL'
                                                    ? 'text-red-600'
                                                    : 'text-amber-600'
                                            }`}>
                                                {prettyEnum(run.verdict, 'VERDICT_')}
                                            </div>
                                        </div>
                                        <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                                            <div className="text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-1">Duration</div>
                                            <div className="text-lg font-black text-slate-800 font-mono">
                                                {run.injection_duration_ms} ms
                                            </div>
                                        </div>
                                        <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                                            <div className="text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-1">Transport</div>
                                            <div className="text-lg font-black text-slate-800">
                                                {prettyEnum(run.transport_type, 'TRANSPORT_')}
                                            </div>
                                        </div>
                                        <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                                            <div className="text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-1">Run ID</div>
                                            <div className="text-lg font-black text-slate-800 font-mono">{run.run_id}</div>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                        <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                                            <div className="text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-1">Frames Sent</div>
                                            <div className="text-lg font-black text-slate-800 font-mono">{run.frames_sent}</div>
                                        </div>
                                        <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                                            <div className="text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-1">Bytes Dropped</div>
                                            <div className="text-lg font-black text-slate-800 font-mono">{run.bytes_dropped}</div>
                                        </div>
                                        <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                                            <div className="text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-1">Timeouts</div>
                                            <div className="text-lg font-black text-slate-800 font-mono">{run.responses_timeout}</div>
                                        </div>
                                        <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                                            <div className="text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-1">Created</div>
                                            <div className="text-sm font-bold text-slate-700">{prettyTimestamp(run.created_at)}</div>
                                        </div>
                                    </div>

                                    <div className="bg-slate-900 rounded-xl overflow-hidden shadow-lg border border-slate-800">
                                        <div className="px-4 py-2 border-b border-slate-800 bg-slate-950 flex items-center justify-between">
                                            <div className="flex items-center gap-2 text-slate-400 text-xs font-bold uppercase tracking-widest">
                                                <Terminal /> Logged Frames
                                            </div>
                                            <div className="flex gap-1.5">
                                                <div className="w-2.5 h-2.5 rounded-full bg-red-500"></div>
                                                <div className="w-2.5 h-2.5 rounded-full bg-amber-500"></div>
                                                <div className="w-2.5 h-2.5 rounded-full bg-green-500"></div>
                                            </div>
                                        </div>

                                        <div className="p-4 font-mono text-xs text-slate-300 space-y-2 h-72 overflow-y-auto">
                                            {logsLoading && <div className="text-slate-400">Loading logs...</div>}
                                            {logsError && <div className="text-red-400">{logsError}</div>}
                                            {!logsLoading && !logsError && logs.length === 0 && (
                                                <div className="text-slate-400">No log rows found for this run.</div>
                                            )}

                                            {!logsLoading && !logsError && logs.map((entry, idx) => {
                                                const timestamp = entry.log_timestamp ?? entry.timestamp ?? entry["Timestamp"] ?? '';
                                                const dataType = entry.data_type ?? entry.dataType ?? entry["Data Type"] ?? 'UNKNOWN';
                                                const hexData = entry.hex_data ?? entry.hexData ?? entry["Data (Hex)"] ?? '';
                                                const asciiData = entry.ascii_data ?? entry.asciiData ?? entry["Data (ASCII)"] ?? '';

                                                return (
                                                    <div key={idx} className="border-b border-slate-800/60 pb-2">
                                                        <div className="text-teal-400">
                                                            [{timestamp}] {dataType}
                                                        </div>
                                                        {hexData && <div className="text-slate-200">HEX: {hexData}</div>}
                                                        {asciiData && <div className="text-slate-500">ASCII: {asciiData}</div>}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'export' && (
                                <div className="max-w-2xl mx-auto py-8 animate-slide">
                                    <div className="text-center mb-10">
                                        <h3 className="text-2xl font-black text-slate-800 mb-2">Export Telemetry</h3>
                                        <p className="text-sm text-slate-500">Download the raw data and execution logs for offline analysis or documentation.</p>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div className="bg-white border border-slate-200 rounded-2xl p-8 flex flex-col items-center text-center shadow-sm hover:shadow-md transition-shadow group">
                                            <div className="w-16 h-16 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                                                <FileJson />
                                            </div>
                                            <h4 className="font-bold text-slate-800 mb-1">JSON Payload</h4>
                                            <p className="text-xs text-slate-500 mb-6">Complete nested data structure including metadata and raw execution logs.</p>
                                            <button
                                                onClick={() => handleDownload('json')}
                                                className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold rounded-xl transition-colors flex items-center justify-center gap-2"
                                            >
                                                <Download /> Download .json
                                            </button>
                                        </div>

                                        <div className="bg-white border border-slate-200 rounded-2xl p-8 flex flex-col items-center text-center shadow-sm hover:shadow-md transition-shadow group">
                                            <div className="w-16 h-16 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                                                <FileSpreadsheet />
                                            </div>
                                            <h4 className="font-bold text-slate-800 mb-1">CSV Spreadsheet</h4>
                                            <p className="text-xs text-slate-500 mb-6">Flat data format optimized for Excel, Pandas, or external visualization tools.</p>
                                            <button
                                                onClick={() => handleDownload('csv')}
                                                className="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold rounded-xl transition-colors flex items-center justify-center gap-2"
                                            >
                                                <Download /> Download .csv
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };
        
        // ==========================================
        // LOGIN COMPONENT
        // ==========================================
        const LoginPage = ({ onBack, onSuccess }) => {
            const [formData, setFormData] = React.useState({ email: '', password: '' });
            const [error, setError] = React.useState(null);

            React.useEffect(() => { lucide.createIcons(); }, [error]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError(null);
                try {
                    const response = await fetch(`${API_BASE_URL}/users/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(formData)
                    });
                    
                    const data = await response.json();
                    if (response.ok) {
                        onSuccess(data, {
                            email: formData.email,
                            password: formData.password,
                        });
                    } else {
                        setError(data.detail || "Login failed");
                    }
                } catch (err) {
                    setError("Network error. Ensure backend is running.");
                }
            };

            const handleChange = (e) => setFormData(prev => ({ ...prev, [e.target.name]: e.target.value }));

            return (
                <div className="min-h-screen flex items-center justify-center p-6 animate-slide">
                    <div className="w-full max-w-xl bg-white rounded-[2.5rem] shadow-2xl border border-slate-100 overflow-hidden flex flex-col md:flex-row">
                        <div className="bg-slate-800 md:w-48 p-8 text-white flex flex-col justify-between">
                            <div className="flex items-center gap-2">
                                <Activity className="text-teal-400" />
                                <span className="font-bold tracking-tighter uppercase text-xs">NexFault</span>
                            </div>
                            <button onClick={onBack} className="flex items-center gap-2 text-xs font-bold text-slate-400 hover:text-teal-400 transition-colors">
                                <ArrowLeft /> Back
                            </button>
                        </div>

                        <div className="flex-1 p-10 lg:p-14">
                            <h2 className="text-3xl font-black text-slate-800 tracking-tight mb-2">Welcome Back</h2>
                            <p className="text-slate-400 text-sm font-medium mb-10 italic">Access your injection profiles</p>
                            
                            {error && <div className="mb-6 p-3 bg-red-50 text-red-600 text-sm rounded-xl font-bold flex items-center gap-2 border border-red-100"><AlertCircle/> {error}</div>}

                            <form className="space-y-5" onSubmit={handleSubmit}>
                                <div className="space-y-1">
                                    <label className="text-[10px] font-bold uppercase text-slate-400 tracking-widest ml-1">Work Email</label>
                                    <div className="flex items-center gap-3 p-3.5 bg-slate-50 border border-slate-200 focus-within:border-teal-500 rounded-xl transition-colors">
                                        <Mail className="text-slate-400" />
                                        <input name="email" value={formData.email} onChange={handleChange} required placeholder="name@domain.com" className="bg-transparent outline-none w-full text-sm" />
                                    </div>
                                </div>
                                <div className="space-y-1">
                                    <label className="text-[10px] font-bold uppercase text-slate-400 tracking-widest ml-1">Password</label>
                                    <div className="flex items-center gap-3 p-3.5 bg-slate-50 border border-slate-200 focus-within:border-teal-500 rounded-xl transition-colors">
                                        <Lock className="text-slate-400" />
                                        <input name="password" type="password" value={formData.password} onChange={handleChange} required placeholder="••••••••" className="bg-transparent outline-none w-full text-sm" />
                                    </div>
                                </div>
                                <button type="submit" className="w-full bg-teal-600 text-white py-4 rounded-2xl font-bold shadow-xl shadow-teal-900/10 hover:bg-teal-700 transition-all mt-4 flex items-center justify-center gap-2 group">
                                    Access Terminal <ArrowRight className="group-hover:translate-x-1 transition-transform" />
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        };

        // ==========================================
        // SIGNUP COMPONENT
        // ==========================================
        const SignUpPage = ({ onBack, onSuccess }) => {
            const [formData, setFormData] = React.useState({ firstName: '', lastName: '', email: '', password: '' });
            const [error, setError] = React.useState(null);

            React.useEffect(() => { lucide.createIcons(); }, [error]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError(null);
                
                if (formData.password.length < 8) {
                    setError("Password must be at least 8 characters");
                    return;
                }

                try {
                    const response = await fetch(`${API_BASE_URL}/users/register`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(formData)
                    });
                    
                    const data = await response.json();
                    if (response.ok) {
                        onSuccess(data, {
                            email: formData.email,
                            password: formData.password,
                        });
                    } else {
                        setError(data.detail || "Registration failed");
                    }
                } catch (err) {
                    setError("Network error. Ensure backend is running.");
                }
            };

            const handleChange = (e) => setFormData(prev => ({ ...prev, [e.target.name]: e.target.value }));

            return (
                <div className="min-h-screen flex items-center justify-center p-6 animate-slide">
                    <div className="w-full max-w-xl bg-white rounded-[2.5rem] shadow-2xl border border-slate-100 overflow-hidden flex flex-col md:flex-row">
                        <div className="bg-slate-800 md:w-48 p-8 text-white flex flex-col justify-between">
                            <div className="flex items-center gap-2">
                                <Activity className="text-teal-400" />
                                <span className="font-bold tracking-tighter uppercase text-xs">NexFault</span>
                            </div>
                            <button onClick={onBack} className="flex items-center gap-2 text-xs font-bold text-slate-400 hover:text-teal-400 transition-colors">
                                <ArrowLeft /> Back
                            </button>
                        </div>

                        <div className="flex-1 p-10 lg:p-14">
                            <h2 className="text-3xl font-black text-slate-800 tracking-tight mb-2">Create Profile</h2>
                            <p className="text-slate-400 text-sm font-medium mb-10 italic">Initialize your engineering profile</p>
                            
                            {error && <div className="mb-6 p-3 bg-red-50 text-red-600 text-sm rounded-xl font-bold flex items-center gap-2 border border-red-100"><AlertCircle/> {error}</div>}

                            <form className="space-y-5" onSubmit={handleSubmit}>
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="space-y-1">
                                        <label className="text-[10px] font-bold uppercase text-slate-400 tracking-widest ml-1">First Name</label>
                                        <input name="firstName" required value={formData.firstName} onChange={handleChange} className="w-full p-3.5 bg-slate-50 border border-slate-200 focus:border-teal-500 rounded-xl outline-none transition-all text-sm" placeholder="John" />
                                    </div>
                                    <div className="space-y-1">
                                        <label className="text-[10px] font-bold uppercase text-slate-400 tracking-widest ml-1">Last Name</label>
                                        <input name="lastName" required value={formData.lastName} onChange={handleChange} className="w-full p-3.5 bg-slate-50 border border-slate-200 focus:border-teal-500 rounded-xl outline-none transition-all text-sm" placeholder="Doe" />
                                    </div>
                                </div>
                                <div className="space-y-1">
                                    <label className="text-[10px] font-bold uppercase text-slate-400 tracking-widest ml-1">Work Email</label>
                                    <div className="flex items-center gap-3 p-3.5 bg-slate-50 border border-slate-200 focus-within:border-teal-500 rounded-xl transition-colors">
                                        <Mail className="text-slate-400" />
                                        <input name="email" type="email" required value={formData.email} onChange={handleChange} placeholder="name@domain.com" className="bg-transparent outline-none w-full text-sm" />
                                    </div>
                                </div>
                                <div className="space-y-1">
                                    <label className="text-[10px] font-bold uppercase text-slate-400 tracking-widest ml-1">Password</label>
                                    <div className="flex items-center gap-3 p-3.5 bg-slate-50 border border-slate-200 focus-within:border-teal-500 rounded-xl transition-colors">
                                        <Lock className="text-slate-400" />
                                        <input name="password" type="password" required value={formData.password} onChange={handleChange} placeholder="••••••••" className="bg-transparent outline-none w-full text-sm" />
                                    </div>
                                </div>
                                <button type="submit" className="w-full bg-teal-600 text-white py-4 rounded-2xl font-bold shadow-xl shadow-teal-900/10 hover:bg-teal-700 transition-all mt-4 flex items-center justify-center gap-2 group">
                                    Create Profile <ArrowRight className="group-hover:translate-x-1 transition-transform" />
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        };

        // ==========================================
        // DASHBOARD COMPONENT
        // ==========================================
        const ByteStrip = ({ label, bytes, baselineBytes = null }) => (
            <div className="space-y-2">
                <div className="text-[10px] font-bold uppercase tracking-widest text-slate-400">{label}</div>
                <div className="flex flex-wrap gap-2">
                    {bytes.length === 0 ? (
                        <div className="text-xs text-slate-400 italic">No frame available</div>
                    ) : (
                        bytes.map((byte, idx) => {
                            const changed = baselineBytes && baselineBytes[idx] !== byte;
                            return (
                                <div
                                    key={`${label}-${idx}`}
                                    className={`px-2.5 py-1.5 rounded-lg text-xs font-mono border ${
                                        changed
                                            ? 'bg-red-50 border-red-200 text-red-700'
                                            : 'bg-slate-50 border-slate-200 text-slate-700'
                                    }`}
                                    title={`Byte ${idx}`}
                                >
                                    {byte}
                                </div>
                            );
                        })
                    )}
                </div>
            </div>
        );

        const Dashboard = ({ user, auth, onLogout }) => {
            const [activeTab, setActiveTab] = React.useState('history');
            const [profileSearch, setProfileSearch] = React.useState(''); 
            
            // NEW: State for tracking which execution history row is selected
            const [selectedRun, setSelectedRun] = React.useState(null);
            
            React.useEffect(() => { lucide.createIcons(); });

            const [runs, setRuns] = React.useState([]);

            const [runForm, setRunForm] = React.useState({
                selectedProfileName: '',
                port: 'FAKE',
                baud: '9600',
                running: false,
                error: null,
                result: null,
            });

            const [profiles, setProfiles] = React.useState([]);
            const [editingId, setEditingId] = React.useState(null);

            const DEFAULT_MODBUS_CONFIG = {
                slave_id: '1',
                func_code: '6',
                address: '100',
                value_or_quantity: '50',
                recalculate_crc: true,
            };

            const PARAM_DEFAULTS = {
                INJ_BIT_FLIP: {
                    every_n_p: '100',
                    bits_drop: '1',
                    mode: 'BITFLIP_RANDOM',
                },
                INJ_BYTE_DROP: {
                    start_offset: '0',
                    length: '1',
                },
                INJ_PHANTOM_BYTE: {
                    offset: '0',
                    byte_value: '0',
                    mode: 'PHANTOM_MANUAL',
                },
            };

            const normalizeTransport = (value) => {
                const map = {
                    UART: 'TRANSPORT_UART',
                    TRANSPORT_UART: 'TRANSPORT_UART',
                    Modbus: 'TRANSPORT_MODBUS',
                    MODBUS: 'TRANSPORT_MODBUS',
                    TRANSPORT_MODBUS: 'TRANSPORT_MODBUS',
                    I2C: 'TRANSPORT_I2C',
                    TRANSPORT_I2C: 'TRANSPORT_I2C',
                };
                return map[value] || value || 'TRANSPORT_MODBUS';
            };

            const normalizeInjectionType = (value) => {
                const map = {
                    BIT_FLIP: 'INJ_BIT_FLIP',
                    INJ_BIT_FLIP: 'INJ_BIT_FLIP',
                    BYTE_DROP: 'INJ_BYTE_DROP',
                    INJ_BYTE_DROP: 'INJ_BYTE_DROP',
                    PHANTOM_BYTE: 'INJ_PHANTOM_BYTE',
                    INJ_PHANTOM_BYTE: 'INJ_PHANTOM_BYTE',
                };
                return map[value] || value || 'INJ_BYTE_DROP';
            };

            const parseMaybeHexInt = (value, fallback = 0) => {
                if (value === undefined || value === null || value === '') return fallback;
                if (typeof value === 'number') return value;
                const trimmed = String(value).trim();
                if (trimmed.startsWith('0x') || trimmed.startsWith('0X')) {
                    const parsed = parseInt(trimmed, 16);
                    return Number.isNaN(parsed) ? fallback : parsed;
                }
                const parsed = parseInt(trimmed, 10);
                return Number.isNaN(parsed) ? fallback : parsed;
            };
            
            const modbusCrc16 = (bytes) => {
                let crc = 0xFFFF;
                for (let i = 0; i < bytes.length; i++) {
                    crc ^= bytes[i];
                    for (let j = 0; j < 8; j++) {
                        if (crc & 1) {
                            crc = (crc >> 1) ^ 0xA001;
                        } else {
                            crc >>= 1;
                        }
                    }
                }
                return crc & 0xFFFF;
            };

            const toHexByte = (value) => value.toString(16).toUpperCase().padStart(2, '0');

            const buildBaselineModbusFrame = (profile) => {
                if (!profile) return [];
                if (normalizeTransport(profile.transport) !== 'TRANSPORT_MODBUS') return [];

                let params = {};
                try {
                    params = profile.injectionParams ? JSON.parse(profile.injectionParams) : {};
                } catch (_) {
                    return [];
                }

                const cfg = params.modbus_config || {};
                const slaveId = parseMaybeHexInt(cfg.slave_id, 1);
                const funcCode = parseMaybeHexInt(cfg.func_code, 6);
                const address = parseMaybeHexInt(cfg.address, 100);
                const valueOrQuantity = parseMaybeHexInt(cfg.value_or_quantity, 50);

                const frame = [
                    slaveId & 0xFF,
                    funcCode & 0xFF,
                    (address >> 8) & 0xFF,
                    address & 0xFF,
                    (valueOrQuantity >> 8) & 0xFF,
                    valueOrQuantity & 0xFF,
                ];

                const crc = modbusCrc16(frame);
                frame.push(crc & 0xFF);
                frame.push((crc >> 8) & 0xFF);

                return frame.map(toHexByte);
            };

            const parseFrameGroups = (frameString) => {
                if (!frameString) return [];
                return String(frameString)
                    .split('|')
                    .map(group =>
                        group
                            .trim()
                            .split(/\s+/)
                            .filter(Boolean)
                            .map((b) => b.toUpperCase())
                    )
                    .filter(group => group.length > 0);
            };

            const framesEqual = (a, b) => {
                if (a.length !== b.length) return false;
                return a.every((byte, idx) => byte === b[idx]);
            };

            const pickRepresentativeFrame = (baseline, frames) => {
                if (!frames || frames.length === 0) return [];
                const firstDifferent = frames.find(frame => !framesEqual(frame, baseline));
                return firstDifferent || frames[0];
            };
            
            const summarizeFrameDiff = (baseline, injected) => {
                const maxLen = Math.max(baseline.length, injected.length);
                const changes = [];

                for (let i = 0; i < maxLen; i++) {
                    const before = baseline[i];
                    const after = injected[i];

                    if (before === after) continue;

                    if (before === undefined) {
                        changes.push(`+${after} at byte ${i}`);
                    } else if (after === undefined) {
                        changes.push(`-${before} at byte ${i}`);
                    } else {
                        changes.push(`${before}→${after} at byte ${i}`);
                    }
                }

                return changes;
            };

            const normalizeParamsForForm = (injType, rawParams, transport) => {
                const normalized = { ...(PARAM_DEFAULTS[injType] || {}) };
                const p = rawParams || {};
            
                if (injType === 'INJ_BIT_FLIP') {
                    normalized.every_n_p = String(
                        p.every_n_p ?? p.every_n_p ?? normalized.every_n_p ?? '100'
                    );
                    normalized.bits_drop = String(
                        p.bits_drop ?? p.bits_drop ?? normalized.bits_drop ?? '1'
                    );
                    normalized.mode =
                        p.mode === 'BITFLIP_PERIODIC' || p.mode === 'Periodic'
                            ? 'BITFLIP_PERIODIC'
                            : p.mode || normalized.mode;
                }

                if (injType === 'INJ_BYTE_DROP') {
                    normalized.start_offset = String(
                        p.start_offset ?? p.start_offset ?? normalized.start_offset ?? '0'
                    );
                    normalized.length = String(
                        p.length ?? normalized.length ?? '1'
                    );
                }

                if (injType === 'INJ_PHANTOM_BYTE') {
                    normalized.offset = String(
                        p.offset ?? normalized.offset ?? '0'
                    );
                    normalized.byte_value = String(
                        p.byte_value ?? p.byte_value ?? normalized.byte_value ?? '0'
                    );
                    normalized.mode =
                        p.mode === 'PHANTOM_MANUAL' || p.mode === 'Manual'
                            ? 'PHANTOM_MANUAL'
                            : p.mode || normalized.mode;
                }

                if (transport === 'TRANSPORT_MODBUS') {
                    normalized.modbus_config = {
                        ...DEFAULT_MODBUS_CONFIG,
                        ...(p.modbus_config || {}),
                    };
                }
                return normalized;
        };

            const buildSavePayload = (form) => {
                const injectionType = normalizeInjectionType(form.injectionType);
                const transport = normalizeTransport(form.transport);
                const params = { ...form.injectionParams };
            
                if (injectionType === 'INJ_BIT_FLIP') {
                    params.every_n_p = parseMaybeHexInt(params.every_n_p, 100);
                    params.bits_drop = parseMaybeHexInt(params.bits_drop, 1);
                    params.mode =
                        params.mode === 'BITFLIP_PERIODIC' ? 'BITFLIP_PERIODIC' : 'BITFLIP_RANDOM';
                }
            
                if (injectionType === 'INJ_BYTE_DROP') {
                    params.start_offset = parseMaybeHexInt(params.start_offset, 0);
                    params.length = parseMaybeHexInt(params.length, 1);
                }
            
                if (injectionType === 'INJ_PHANTOM_BYTE') {
                    params.offset = parseMaybeHexInt(params.offset, 0);
                    params.byte_value = parseMaybeHexInt(params.byte_value, 0);
                    params.mode =
                        params.mode === 'PHANTOM_RANDOM' ? 'PHANTOM_RANDOM' : 'PHANTOM_MANUAL';
                }
            
                if (transport === 'TRANSPORT_MODBUS') {
                    const cfg = params.modbus_config || DEFAULT_MODBUS_CONFIG;
                    params.modbus_config = {
                        slave_id: parseMaybeHexInt(cfg.slave_id, 1),
                        func_code: parseMaybeHexInt(cfg.func_code, 6),
                        address: parseMaybeHexInt(cfg.address, 100),
                        value_or_quantity: parseMaybeHexInt(cfg.value_or_quantity, 50),
                        recalculate_crc: Boolean(cfg.recalculate_crc),
                    };
                }
            
                return {
                    ...form,
                    transport,
                    injectionType,
                    injectionParams: JSON.stringify(params),
                };
            };

            const [configForm, setConfigForm] = React.useState({
                userId: user.id,
                profileName: '',
                description: '',
                transport: 'TRANSPORT_MODBUS',
                injectionType: 'INJ_BYTE_DROP',
                duration: '5000',
                payload: '0xFF',
                injectionParams: PARAM_DEFAULTS['INJ_BIT_FLIP'],
            });

            const fetchProfiles = async () => {
                try {
                    const response = await fetch(`${API_BASE_URL}/profiles?user_id=${user.id}`);
                    if (response.ok) {
                        const data = await response.json();
                        setProfiles(data);
                    }
                } catch (error) {
                    console.error("Network error fetching profiles:", error);
                }
            };
            
            const fetchRuns = async () => {
                try {
                    const response = await fetch(`${API_BASE_URL}/runs?user_id=${user.id}`);
                    if (response.ok) {
                        const data = await response.json();
                        setRuns(data);
                    } else {
                        setRuns([]);
                    }
                } catch (error) {
                    console.error('Network error fetching runs:', error);
                    setRuns([]);
                }
            };

            const buildBasicAuthHeaders = () => { 
                if (!auth?.email || !auth?.password) {
                    return {}; 
                } return { 
                    Authorization: `Basic ${btoa(`${auth.email}:${auth.password}`)}` 
                }; 
            };

            React.useEffect(() => {
                if (activeTab === 'config' || activeTab === 'run') fetchProfiles();
            }, [activeTab]);

            React.useEffect(() => {
                if (activeTab === 'history') fetchRuns();
            }, [activeTab, user.id]);

            React.useEffect(() => {
                if (editingId !== null) {
                    const profileToEdit = profiles.find((p) => p.id === editingId);
                    if (profileToEdit) {
                        let parsedParams = {};
                        try {
                            if (profileToEdit.injectionParams) {
                                parsedParams = JSON.parse(profileToEdit.injectionParams);
                            }
                        } catch (e) {
                            console.error('Error parsing params', e);
                        }
                    
                        const normalizedInjectionType = normalizeInjectionType(profileToEdit.injectionType);
                        const normalizedTransport = normalizeTransport(profileToEdit.transport);
                    
                        setConfigForm({
                            ...profileToEdit,
                            userId: user.id,
                            injectionType: normalizedInjectionType,
                            transport: normalizedTransport,
                            injectionParams: normalizeParamsForForm(
                                normalizedInjectionType,
                                parsedParams,
                                normalizedTransport
                            ),
                        });
                    }
                } else {
                    setConfigForm({
                        userId: user.id,
                        profileName: '',
                        description: '',
                        transport: 'TRANSPORT_UART',
                        injectionType: 'INJ_BIT_FLIP',
                        duration: '5000',
                        payload: '0xFF',
                        injectionParams: PARAM_DEFAULTS['INJ_BIT_FLIP'],
                        });
                    }
            }, [editingId, profiles, user.id]);

            React.useEffect(() => {
              if (profiles.length > 0 && !runForm.selectedProfileName) {
                setRunForm(prev => ({
                  ...prev,
                  selectedProfileName: profiles[0].profileName
                }));
              }
            }, [profiles]);

            const handleConfigChange = (e) => {
                const { name, value } = e.target;

                if (name === 'injectionType') {
                    const normalizedInjectionType = normalizeInjectionType(value);
                    setConfigForm((prev) => ({
                        ...prev,
                        injectionType: normalizedInjectionType,
                        injectionParams: normalizeParamsForForm(
                            normalizedInjectionType,
                            {},
                            prev.transport
                        ),
                    }));
                    return;
                }

                if (name === 'transport') {
                    const normalizedTransport = normalizeTransport(value);
                    setConfigForm((prev) => ({
                        ...prev,
                        transport: normalizedTransport,
                        injectionParams: normalizeParamsForForm(
                            prev.injectionType,
                            prev.injectionParams,
                            normalizedTransport
                        ),
                    }));
                    return;
                }

                setConfigForm((prev) => ({
                    ...prev, [name]: value 
                }));
            };

            const handleParamChange = (e) => {
                const { name, value } = e.target;
                setConfigForm(prev => ({ ...prev, injectionParams: { ...prev.injectionParams, [name]: value } }));
            };

            const handleSaveProfile = async (e) => {
                e.preventDefault();

                const existingProfile = editingId
                    ? profiles.find((p) => p.id === editingId)
                    : null;

                if (editingId && !existingProfile) {
                    alert("Could not find the profile being edited.");
                    return;
                }

                const url = editingId
                    ? `${API_BASE_URL}/profiles/${encodeURIComponent(existingProfile.profileName)}`
                    : `${API_BASE_URL}/profiles`;

                const method = editingId ? 'PUT' : 'POST';
                const payloadToSend = buildSavePayload({
                    ...configForm,
                    userId: String(user.id),
                });

                try {
                    const response = await fetch(url, {
                        method,
                        headers: {
                            'Content-Type': 'application/json',
                            ...(editingId ? buildBasicAuthHeaders() : {}),
                        },
                        body: JSON.stringify(payloadToSend),
                    });

                    const data = await response.json().catch(() => null);

                    if (!response.ok) {
                        throw new Error(data?.detail || "Error saving profile.");
                    }

                    await fetchProfiles();

                    if (!editingId && data?.id) {
                        setEditingId(data.id);
                    }
                } catch (error) {
                    alert(error.message || "Network error.");
                }
            };
            
            const handleRunSavedProfile = async () => {
                if (!runForm.selectedProfileName) return;

                if (!auth?.email || !auth?.password) { 
                    setRunForm(prev => ({ ...prev, error: 'Not authenticated', })); 
                    return; 
                }
                setRunForm(prev => ({
                    ...prev,
                    running: true,
                    error: null,
                    result: null,
                }));
                try {
                    const response = await fetch(
                        `${API_BASE_URL}/profiles/${encodeURIComponent(runForm.selectedProfileName)}/run`,
                        {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                ...buildBasicAuthHeaders(),
                            },
                            body: JSON.stringify({
                                port: runForm.port,
                                baud: Number(runForm.baud),
                            }),
                        }
                    );
                    const data = await response.json();
                    if (!response.ok) {
                        throw new Error(data.detail || 'Run failed');
                    }
                    await fetchRuns();
                    setRunForm(prev => ({
                        ...prev,
                        running: false,
                        result: data,
                    }));
                } catch (err) {
                    setRunForm(prev => ({
                        ...prev,
                        running: false,
                        error: err.message || 'Run failed',
                    }));
                }
            };

            const handleDeleteProfile = async (profile, e) => {
            e.stopPropagation();
            if (!window.confirm("Are you sure you want to delete this profile?")) return;

            try {
                const response = await fetch(
                    `${API_BASE_URL}/profiles/${encodeURIComponent(profile.profileName)}`,
                    {
                        method: 'DELETE',
                        headers: {
                            ...buildBasicAuthHeaders(),
                        },
                    }
                );

                if (!response.ok) {
                    const data = await response.json().catch(() => null);
                    throw new Error(data?.detail || "Failed to delete profile.");
                }

                if (editingId === profile.id) {
                    setEditingId(null);
                }

                await fetchProfiles();
            } catch (error) {
                alert(error.message || "Failed to delete profile.");
            }
        };
                    
            const filteredProfiles = profiles.filter(p => 
                (p.profileName || '').toLowerCase().includes(profileSearch.toLowerCase()) || 
                (p.description || '').toLowerCase().includes(profileSearch.toLowerCase())
            );

            return (
                <div className="min-h-screen flex bg-slate-50 animate-slide">
                    
                    {selectedRun && (
                        <RunDetailsModal
                            run={selectedRun}
                            auth={auth}
                            onClose={() => setSelectedRun(null)}
                        />
                    )}

                    <aside className="w-64 bg-slate-800 text-slate-300 flex flex-col hidden md:flex shrink-0">
                        <div className="p-6 flex items-center gap-2 border-b border-slate-700">
                            <Activity className="text-teal-400" />
                            <span className="font-bold tracking-tighter uppercase text-white">NexFault</span>
                        </div>
                        <div className="px-6 py-4 border-b border-slate-700">
                            <div className="text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-1">Operator</div>
                            <div className="text-white text-sm font-medium truncate">{user.firstName} {user.lastName}</div>
                        </div>
                        <nav className="flex-1 p-4 space-y-2">
                            <button onClick={() => setActiveTab('history')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-colors ${activeTab === 'history' ? 'bg-teal-600/10 text-teal-400' : 'hover:bg-slate-700/50 hover:text-white'}`}><FileText /> Test History</button>
                            <button onClick={() => setActiveTab('config')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-colors ${activeTab === 'config' ? 'bg-teal-600/10 text-teal-400' : 'hover:bg-slate-700/50 hover:text-white'}`}><Settings /> Configurations</button>
                            <button onClick={() => setActiveTab('run')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-colors ${ activeTab === 'run' ? 'bg-teal-600/10 text-teal-400' : 'hover:bg-slate-700/50 hover:text-white' }`} > <Activity /> Run Test </button>
                        </nav>
                        <div className="p-4 border-t border-slate-700">
                            <button onClick={onLogout} className="flex items-center gap-3 w-full hover:bg-slate-700/50 hover:text-white px-4 py-3 rounded-xl font-medium transition-colors text-sm"><LogOut /> Sign Out</button>
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col h-screen overflow-hidden relative">
                        <header className="bg-white border-b border-slate-200 px-8 py-5 flex items-center justify-between z-10 shrink-0">
                            <div>
                                <h1 className="text-xl font-bold text-slate-800 tracking-tight">
                                    {activeTab === 'history'
                                        ? 'Recent Executions'
                                        : activeTab === 'config'
                                        ? 'Profile Configuration'
                                        : 'Run Test'
                                    }
                                </h1>
                                <p className="text-xs text-slate-400 font-medium">
                                    {activeTab === 'history'
                                        ? 'Review past fault injection runs'
                                        : activeTab === 'config'
                                        ? 'Create and manage injection profiles'
                                        : 'Launch a saved injection profile from the browser'}
                                </p>
                            </div>
                        </header>

                        <div className={`flex-1 overflow-hidden flex flex-col ${activeTab === 'history' ? 'p-8' : ''}`}>
                            
                            {activeTab === 'history' && (
                                <div className="flex-1 bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden animate-slide">
                                    {runs.length === 0 ? (
                                        <div className="h-full flex items-center justify-center">
                                            <div className="text-center max-w-md px-8">
                                                <div className="text-lg font-bold text-slate-800 mb-2">No stored runs yet</div>
                                                <p className="text-sm text-slate-500 leading-relaxed">
                                                    Run a test from the Run Test tab and completed executions will appear here.
                                                </p>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="overflow-auto h-full">
                                            <table className="w-full text-sm">
                                                <thead className="bg-slate-50 border-b border-slate-200 sticky top-0 z-10">
                                                    <tr className="text-left">
                                                        <th className="px-5 py-4 text-[10px] font-bold uppercase tracking-widest text-slate-400">Test Name</th>
                                                        <th className="px-5 py-4 text-[10px] font-bold uppercase tracking-widest text-slate-400">Profile</th>
                                                        <th className="px-5 py-4 text-[10px] font-bold uppercase tracking-widest text-slate-400">Transport</th>
                                                        <th className="px-5 py-4 text-[10px] font-bold uppercase tracking-widest text-slate-400">Injection</th>
                                                        <th className="px-5 py-4 text-[10px] font-bold uppercase tracking-widest text-slate-400">Duration</th>
                                                        <th className="px-5 py-4 text-[10px] font-bold uppercase tracking-widest text-slate-400">Status</th>
                                                        <th className="px-5 py-4 text-[10px] font-bold uppercase tracking-widest text-slate-400">Verdict</th>
                                                        <th className="px-5 py-4 text-[10px] font-bold uppercase tracking-widest text-slate-400">Created</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {runs.map((run, idx) => (
                                                        <tr
                                                            key={`${run.test_name}-${idx}`}
                                                            onClick={() => setSelectedRun(run)}
                                                            className="border-b border-slate-100 hover:bg-slate-50 cursor-pointer transition-colors"
                                                        >
                                                            <td className="px-5 py-4 font-mono text-xs text-slate-800">{run.test_name}</td>
                                                            <td className="px-5 py-4 font-medium text-slate-700">{run.profile_name}</td>
                                                            <td className="px-5 py-4 text-slate-600">{String(run.transport_type).replace('TRANSPORT_', '')}</td>
                                                            <td className="px-5 py-4 text-slate-600">{String(run.injection_type).replace('INJ_', '')}</td>
                                                            <td className="px-5 py-4 font-mono text-slate-600">{run.injection_duration_ms} ms</td>
                                                            <td className="px-5 py-4 text-slate-600">{String(run.status).replace('STATUS_', '')}</td>
                                                            <td className="px-5 py-4">
                                                                <span className={`text-xs font-bold px-2.5 py-1 rounded-full ${
                                                                    run.verdict === 'VERDICT_PASS'
                                                                        ? 'bg-teal-50 text-teal-700'
                                                                        : run.verdict === 'VERDICT_FAIL'
                                                                        ? 'bg-red-50 text-red-700'
                                                                        : 'bg-amber-50 text-amber-700'
                                                                }`}>
                                                                    {String(run.verdict).replace('VERDICT_', '')}
                                                                </span>
                                                            </td>
                                                            <td className="px-5 py-4 text-slate-500 text-xs">
                                                                {new Date(run.created_at).toLocaleString()}
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    )}
                                </div>
                            )}

                            {activeTab === 'config' && (
                                <div className="flex w-full h-full animate-slide">
                                    <div className="w-72 bg-white border-r border-slate-200 flex flex-col shrink-0 z-0 shadow-[4px_0_24px_rgba(0,0,0,0.02)]">
                                        <div className="p-5 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
                                            <h3 className="text-xs font-bold uppercase tracking-widest text-slate-400">Saved Profiles</h3>
                                            <button onClick={() => setEditingId(null)} className="p-1.5 bg-teal-50 text-teal-600 rounded-lg hover:bg-teal-100 transition-colors"><Plus /></button>
                                        </div>
                                        
                                        <div className="p-3 border-b border-slate-100 bg-white">
                                            <div className="relative">
                                                <Search className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" />
                                                <input 
                                                    type="text" 
                                                    placeholder="Search profiles..." 
                                                    value={profileSearch}
                                                    onChange={(e) => setProfileSearch(e.target.value)}
                                                    className="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs outline-none focus:border-teal-500 transition-all font-medium text-slate-600 placeholder:font-normal"
                                                />
                                            </div>
                                        </div>

                                        <div className="flex-1 overflow-y-auto p-3 space-y-2">
                                            {filteredProfiles.map(p => (
                                                <div key={p.id} onClick={() => setEditingId(p.id)} className={`w-full text-left p-4 rounded-xl transition-all border cursor-pointer ${editingId === p.id ? 'bg-slate-800 border-slate-800 text-white shadow-lg shadow-slate-900/10' : 'bg-white border-slate-100 hover:border-slate-300 text-slate-700 hover:bg-slate-50'}`}>
                                                    <div className="flex justify-between items-start mb-1">
                                                        <div className="font-bold text-sm truncate pr-2">{p.profileName || 'Unnamed Profile'}</div>
                                                        <button onClick={(e) => handleDeleteProfile(p, e)} className={`p-1.5 -mr-1.5 -mt-1.5 rounded-md transition-colors ${editingId === p.id ? 'text-slate-400 hover:text-red-400 hover:bg-slate-700' : 'text-slate-400 hover:text-red-500 hover:bg-red-50'}`}><Trash2 /></button>
                                                    </div>
                                                    <div className={`text-xs line-clamp-2 leading-relaxed ${editingId === p.id ? 'text-slate-400' : 'text-slate-500'}`}>{p.description || 'No description provided.'}</div>
                                                </div>
                                            ))}
                                            {filteredProfiles.length === 0 && (
                                                <p className="text-xs text-slate-400 text-center py-6">No profiles found.</p>
                                            )}
                                        </div>
                                    </div>

                                    <div className="flex-1 overflow-y-auto p-8 lg:p-12">
                                        <div className="max-w-3xl mx-auto">
                                            <div className="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden pb-6">
                                                <div className="px-8 py-6 border-b border-slate-100 flex items-center justify-between bg-slate-50/30">
                                                    <h2 className="text-lg font-bold text-slate-800">{editingId ? 'Edit Profile' : 'New Profile'}</h2>
                                                    <button onClick={handleSaveProfile} className="bg-teal-600 text-white px-5 py-2 rounded-lg text-xs font-bold shadow-lg shadow-teal-900/10 hover:bg-teal-700 transition-all flex items-center gap-2">
                                                        <Save className="w-4 h-4" /> Save
                                                    </button>
                                                </div>
                                                
                                                <form className="p-8 space-y-6">
                                                    <div className="space-y-1.5">
                                                        <label className="text-[10px] font-bold uppercase text-slate-400 tracking-widest ml-1">Profile Name</label>
                                                        <input name="profileName" value={configForm.profileName} onChange={handleConfigChange} className="w-full p-3 bg-slate-50 border border-slate-200 focus:border-teal-500 rounded-xl outline-none transition-all text-sm font-medium" />
                                                    </div>
                                                    
                                                    <div className="space-y-1.5">
                                                        <label className="text-[10px] font-bold uppercase text-slate-400 tracking-widest ml-1">Description</label>
                                                        <textarea name="description" value={configForm.description} onChange={handleConfigChange} rows="2" className="w-full p-3 bg-slate-50 border border-slate-200 focus:border-teal-500 rounded-xl outline-none transition-all text-sm resize-none" />
                                                    </div>

                                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                                        <div className="space-y-1.5">
                                                            <label className="text-[10px] font-bold uppercase text-slate-400 tracking-widest ml-1">Transport</label>
                                                            <select name="transport" value={configForm.transport} onChange={handleConfigChange} className="w-full p-3 bg-slate-50 border border-slate-200 focus:border-teal-500 rounded-xl outline-none transition-all text-sm font-medium appearance-none">
                                                                <option value="TRANSPORT_UART">UART</option>
                                                                <option value="TRANSPORT_MODBUS">Modbus</option>
                                                                <option value="TRANSPORT_I2C">I2C</option>
                                                            </select>
                                                        </div>
                                                        <div className="space-y-1.5">
                                                            <label className="text-[10px] font-bold uppercase text-slate-400 tracking-widest ml-1">Injection Type</label>
                                                            <select name="injectionType" value={configForm.injectionType} onChange={handleConfigChange} className="w-full p-3 bg-slate-50 border border-slate-200 focus:border-teal-500 rounded-xl outline-none transition-all text-sm font-medium appearance-none">
                                                                <option value="INJ_BIT_FLIP">BIT_FLIP</option>
                                                                <option value="INJ_BYTE_DROP">BYTE_DROP</option>
                                                                <option value="INJ_PHANTOM_BYTE">PHANTOM_BYTE</option>
                                                            </select>
                                                        </div>
                                                        <div className="space-y-1.5">
                                                            <label className="text-[10px] font-bold uppercase text-slate-400 tracking-widest ml-1">Duration (ms)</label>
                                                            <input name="duration" value={configForm.duration} onChange={handleConfigChange} className="w-full p-3 bg-slate-50 border border-slate-200 focus:border-teal-500 rounded-xl outline-none transition-all text-sm" />
                                                        </div>
                                                    </div>

                                                    <hr className="border-slate-100 my-8" />

                                                    {/* Dynamic Parameters Based on Injection Type */}
                                                    {configForm.injectionType === 'INJ_BIT_FLIP' && (
                                                        <div>
                                                            <h3 className="text-sm font-bold text-slate-800 mb-4">Bit Flip Parameters</h3>
                                                            <div className="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                                                                <div className="space-y-1.5">
                                                                    <label className="text-[10px] font-bold uppercase text-slate-400 tracking-widest ml-1">Every N Packets</label>
                                                                    <input name="every_n_p" value={configForm.injectionParams.every_n_p || ''} onChange={handleParamChange} className="w-full p-3 bg-slate-50 border border-slate-200 focus:border-teal-500 rounded-xl outline-none transition-all text-sm" />
                                                                </div>
                                                                <div className="space-y-1.5">
                                                                    <label className="text-[10px] font-bold uppercase text-slate-400 tracking-widest ml-1">Bits to Drop</label>
                                                                    <input name="bits_drop" value={configForm.injectionParams.bits_drop || ''} onChange={handleParamChange} className="w-full p-3 bg-slate-50 border border-slate-200 focus:border-teal-500 rounded-xl outline-none transition-all text-sm" />
                                                                </div>
                                                                <div className="space-y-1.5">
                                                                    <label className="text-[10px] font-bold uppercase text-slate-400 tracking-widest ml-1">Payload</label>
                                                                    <input name="payload" value={configForm.payload} onChange={handleConfigChange} className="w-full p-3 bg-slate-50 border border-slate-200 focus:border-teal-500 rounded-xl outline-none transition-all text-sm font-mono" />
                                                                </div>
                                                                <div className="space-y-1.5">
                                                                    <select name="mode" value={configForm.injectionParams.mode || 'BITFLIP_RANDOM'} onChange={handleParamChange} className="w-full p-3 bg-slate-50 border border-slate-200 focus:border-teal-500 rounded-xl outline-none transition-all text-sm font-medium appearance-none">
                                                                        <option value="BITFLIP_RANDOM">BITFLIP_RANDOM</option>
                                                                        <option value="BITFLIP_PERIODIC">BITFLIP_PERIODIC</option>
                                                                    </select>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    )}

                                                    {configForm.injectionType === 'INJ_BYTE_DROP' && (
                                                        <div>
                                                            <h3 className="text-sm font-bold text-slate-800 mb-4">Byte Drop Parameters</h3>
                                                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
                                                                <div className="space-y-1.5">
                                                                    <label className="text-[10px] font-bold uppercase text-slate-400 tracking-widest ml-1">Start Offset</label>
