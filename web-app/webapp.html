                                                                    <input name="start_offset" value={configForm.injectionParams.start_offset || ''} onChange={handleParamChange} className="w-full p-3 bg-slate-50 border border-slate-200 focus:border-teal-500 rounded-xl outline-none transition-all text-sm" />
                                                                </div>
                                                                <div className="space-y-1.5">
                                                                    <label className="text-[10px] font-bold uppercase text-slate-400 tracking-widest ml-1">Length</label>
                                                                    <input name="length" value={configForm.injectionParams.length || ''} onChange={handleParamChange} className="w-full p-3 bg-slate-50 border border-slate-200 focus:border-teal-500 rounded-xl outline-none transition-all text-sm" />
                                                                </div>
                                                                <div className="space-y-1.5">
                                                                    <label className="text-[10px] font-bold uppercase text-slate-400 tracking-widest ml-1">Payload</label>
                                                                    <input name="payload" value={configForm.payload} onChange={handleConfigChange} className="w-full p-3 bg-slate-50 border border-slate-200 focus:border-teal-500 rounded-xl outline-none transition-all text-sm font-mono" />
                                                                </div>
                                                            </div>
                                                        </div>
                                                    )}

                                                    {configForm.injectionType === 'INJ_PHANTOM_BYTE' && (
                                                        <div>
                                                            <h3 className="text-sm font-bold text-slate-800 mb-4">Phantom Byte Parameters</h3>
                                                            <div className="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                                                                <div className="space-y-1.5">
                                                                    <label className="text-[10px] font-bold uppercase text-slate-400 tracking-widest ml-1">Offset</label>
                                                                    <input name="offset" value={configForm.injectionParams.offset || ''} onChange={handleParamChange} className="w-full p-3 bg-slate-50 border border-slate-200 focus:border-teal-500 rounded-xl outline-none transition-all text-sm" />
                                                                </div>
                                                                <div className="space-y-1.5">
                                                                    <label className="text-[10px] font-bold uppercase text-slate-400 tracking-widest ml-1">Byte Value</label>
                                                                    <input name="byte_value" value={configForm.injectionParams.byte_value || ''} onChange={handleParamChange} className="w-full p-3 bg-slate-50 border border-slate-200 focus:border-teal-500 rounded-xl outline-none transition-all text-sm font-mono" />
                                                                </div>
                                                                <div className="space-y-1.5">
                                                                    <label className="text-[10px] font-bold uppercase text-slate-400 tracking-widest ml-1">Payload</label>
                                                                    <input name="payload" value={configForm.payload} onChange={handleConfigChange} className="w-full p-3 bg-slate-50 border border-slate-200 focus:border-teal-500 rounded-xl outline-none transition-all text-sm font-mono" />
                                                                </div>
                                                                <div className="space-y-1.5">
                                                                    <select name="mode" value={configForm.injectionParams.mode || 'PHANTOM_MANUAL'} onChange={handleParamChange} className="w-full p-3 bg-slate-50 border border-slate-200 focus:border-teal-500 rounded-xl outline-none transition-all text-sm font-medium appearance-none">
                                                                        <option value="PHANTOM_MANUAL">PHANTOM_MANUAL</option>
                                                                        <option value="PHANTOM_RANDOM">PHANTOM_RANDOM</option>
                                                                    </select>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    )}
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}
                            {activeTab === 'run' && (
                                <div className="flex-1 overflow-y-auto bg-white border border-slate-200 rounded-2xl shadow-sm p-8 animate-slide">
                                <div className="max-w-3xl space-y-6 pb-10">
                                    <div>
                                        <h2 className="text-2xl font-black text-slate-800">Run Test</h2>
                                        <p className="text-sm text-slate-500 mt-1">
                                        Launch a saved injection profile directly from the browser.
                                        </p>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div className="space-y-1">
                                        <label className="text-[10px] font-bold uppercase text-slate-400 tracking-widest ml-1">
                                            Saved Profile
                                        </label>
                                        <select
                                            value={runForm.selectedProfileName}
                                            onChange={(e) =>
                                            setRunForm(prev => ({ ...prev, selectedProfileName: e.target.value }))
                                            }
                                            className="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl outline-none text-sm"
                                        >
                                            <option value="">Select a profile</option>
                                            {profiles.map((profile) => (
                                            <option key={profile.id} value={profile.profileName}>
                                                {profile.profileName}
                                            </option>
                                            ))}
                                        </select>
                                        </div>

                                        <div className="space-y-1">
                                        <label className="text-[10px] font-bold uppercase text-slate-400 tracking-widest ml-1">
                                            Serial Port
                                        </label>
                                        <input
                                            value={runForm.port}
                                            onChange={(e) =>
                                            setRunForm(prev => ({ ...prev, port: e.target.value }))
                                            }
                                            className="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl outline-none text-sm"
                                            placeholder="FAKE or COM5"
                                        />
                                        </div>

                                        <div className="space-y-1">
                                        <label className="text-[10px] font-bold uppercase text-slate-400 tracking-widest ml-1">
                                            Baud
                                        </label>
                                        <input
                                            value={runForm.baud}
                                            onChange={(e) =>
                                            setRunForm(prev => ({ ...prev, baud: e.target.value }))
                                            }
                                            className="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl outline-none text-sm"
                                            placeholder="9600"
                                        />
                                        </div>
                                    </div>

                                    {runForm.error && (
                                        <div className="p-3 bg-red-50 text-red-600 text-sm rounded-xl font-bold border border-red-100">
                                        {runForm.error}
                                        </div>
                                    )}

                                    <button
                                        onClick={handleRunSavedProfile}
                                        disabled={runForm.running || !runForm.selectedProfileName}
                                        className="px-6 py-3 bg-teal-600 text-white rounded-xl font-bold hover:bg-teal-700 transition disabled:opacity-50"
                                    >
                                        {runForm.running ? 'Running...' : 'Run Saved Profile'}
                                    </button>

                                    {runForm.result && (
                                        <div className="mt-6 bg-slate-900 rounded-xl overflow-hidden border border-slate-800">
                                        <div className="px-4 py-3 border-b border-slate-800 text-slate-300 text-xs font-bold uppercase tracking-widest">
                                            Latest Run Result
                                        </div>
                                        <pre className="p-4 text-xs text-slate-200 overflow-x-auto whitespace-pre-wrap">
                                            {JSON.stringify(runForm.result, null, 2)}
                                        </pre>
                                        {runForm.result && (() => {
                                        const selectedProfile = profiles.find(
                                            (p) => p.profileName === runForm.selectedProfileName
                                        );

                                        const baselineFrame = buildBaselineModbusFrame(selectedProfile);
                                        const transmittedFrames = parseFrameGroups(runForm.result.final_frame);
                                        const representativeFrame = pickRepresentativeFrame(baselineFrame, transmittedFrames);
                                        const diffSummary = summarizeFrameDiff(baselineFrame, representativeFrame);

                                        if (
                                            normalizeTransport(selectedProfile?.transport || '') !== 'TRANSPORT_MODBUS' ||
                                            transmittedFrames.length === 0
                                        ) {
                                            return null;
                                        }

                                        const reportLooksInconsistent =
                                            runForm.result.injection_type === 'INJ_BIT_FLIP' &&
                                            framesEqual(representativeFrame, baselineFrame) &&
                                            Number(runForm.result.bits_flipped || 0) === 0;

                                        return (
                                            <div className="mt-6 bg-white border border-slate-200 rounded-2xl shadow-sm p-6 space-y-5">
                                                <div>
                                                    <h3 className="text-lg font-bold text-slate-800">Frame Impact</h3>
                                                    <p className="text-sm text-slate-500">
                                                        Expected baseline RTU frame versus injected frame actually sent by DSI.
                                                    </p>
                                                </div>

                                                <div className="grid gap-5">
                                                    <ByteStrip label="Baseline frame" bytes={baselineFrame} />
                                                    <ByteStrip
                                                        label="Representative transmitted frame"
                                                        bytes={representativeFrame}
                                                        baselineBytes={baselineFrame}
                                                    />
                                                </div>
                                                <div className="bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-3">
                                                    <div>
                                                        <div className="text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-2">
                                                            Change summary
                                                        </div>
                                                        {diffSummary.length === 0 ? (
                                                            <div className="text-sm text-slate-500">No byte-level difference detected in the representative frame.</div>
                                                        ) : (
                                                            <ul className="text-sm text-slate-700 space-y-1">
                                                                {diffSummary.map((item, idx) => (
                                                                    <li key={idx} className="font-mono">{item}</li>
                                                                ))}
                                                            </ul>
                                                        )}
                                                    </div>
                                                
                                                    <div className="pt-2 border-t border-slate-200 text-xs text-slate-500">
                                                        Frames captured in report: <span className="font-bold">{transmittedFrames.length}</span>
                                                    </div>
                                                
                                                    <div className="text-xs text-slate-500 font-mono break-all">
                                                        {runForm.result.final_frame}
                                                    </div>
                                                
                                                    {reportLooksInconsistent && (
                                                        <div className="p-3 bg-amber-50 border border-amber-200 rounded-lg text-amber-800 text-xs">
                                                            TMI report did not include a visibly mutated transmitted frame for this Bit Flip run.
                                                            Use the UUT serial monitor as the ground-truth visual for this test.
                                                        </div>
                                                    )}
                                                </div>

                                                <div className="text-xs text-slate-500">
                                                    CRC recalculated: <span className="font-bold">{String(runForm.result.crc_recalculated)}</span>
                                                </div>
                                            </div>
                                        );
                                    })()}
                                                                            
                                        </div>
                                    )}
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>
                </div>
            );
        };

        // ==========================================
        // LANDING PAGE
        // ==========================================
        const LandingPage = ({ onSignUp, onLogin }) => {
            const [isMenuOpen, setIsMenuOpen] = React.useState(false);
            React.useEffect(() => { lucide.createIcons(); }, [isMenuOpen]);

            return (
                <div className="min-h-screen font-sans text-slate-700 animate-slide">
                    <nav className="flex justify-between items-center px-10 py-5 bg-[#f1f5f9] border-b border-slate-200 sticky top-0 z-50">
                        <div className="flex items-center gap-2.5 group">
                            <div className="bg-slate-800 p-2 rounded-xl group-hover:bg-teal-600 transition-colors">
                                <Activity className="text-white" />
                            </div>
                            <div className="text-slate-800 font-extrabold text-xl tracking-tighter uppercase">
                                NEX<span className="text-teal-600">FAULT</span>
                            </div>
                        </div>
                        <div className="flex items-center gap-4">
                            <button onClick={onLogin} className="hidden md:block text-slate-500 hover:text-slate-800 px-4 py-2.5 text-xs font-bold uppercase tracking-widest transition-colors">Log In</button>
                            <button onClick={onSignUp} className="hidden md:block bg-slate-800 text-white px-6 py-2.5 rounded-xl text-xs font-bold uppercase tracking-widest hover:bg-slate-700 transition-all shadow-md">Create Profile</button>
                            <div className="relative">
                                <button onClick={() => setIsMenuOpen(!isMenuOpen)} className="md:hidden p-2 text-slate-500 bg-white border border-slate-200 rounded-xl hover:text-teal-600 transition-all shadow-sm">
                                    {isMenuOpen ? <X /> : <Menu />}
                                </button>
                                {isMenuOpen && (
                                    <div className="absolute right-0 mt-4 w-64 bg-white border border-slate-100 rounded-2xl shadow-2xl z-[60] overflow-hidden">
                                        <div className="py-2">
                                            <div className="px-5 py-3 text-[10px] font-bold text-slate-300 uppercase tracking-widest border-b border-slate-50 mb-1">Options</div>
                                            <button onClick={onLogin} className="w-full flex items-center gap-3 px-5 py-4 text-sm font-bold text-slate-600 hover:bg-slate-50 text-left"><Lock className="w-4 h-4" /> Log In</button>
                                            <button onClick={onSignUp} className="w-full flex items-center gap-3 px-5 py-4 text-sm font-bold text-teal-600 hover:bg-teal-50 text-left"><Activity className="w-4 h-4" /> Create Profile</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </nav>

                    <section className="py-24 px-10 max-w-7xl mx-auto flex flex-col lg:flex-row items-center gap-20 text-center lg:text-left">
                        <div className="flex-1">
                            <h1 className="text-6xl lg:text-8xl font-black mb-8 text-slate-800 tracking-tight leading-[0.9]">
                                Reliability <br/><span className="text-slate-400">by design.</span>
                            </h1>
                            <p className="text-xl font-medium text-slate-500 mb-12 max-w-lg mx-auto lg:mx-0 leading-relaxed">
                                NexFault provides advanced fault injection to guarantee firmware integrity in mission-critical environments.
                            </p>
                            <div className="flex items-center justify-center lg:justify-start gap-4">
                                <button onClick={onSignUp} className="bg-teal-600 text-white px-8 py-5 rounded-2xl font-bold text-lg shadow-xl shadow-teal-900/10 hover:bg-teal-700 hover:-translate-y-1 transition-all flex items-center gap-3">
                                    Create Profile <ArrowRight />
                                </button>
                            </div>
                        </div>
                        <div className="flex-1 hidden lg:flex justify-end">
                            <div className="w-96 h-96 bg-white rounded-[3rem] shadow-[0_40px_80px_rgba(0,0,0,0.06)] border border-slate-100 flex items-center justify-center rotate-2 scale-110">
                                <div className="text-slate-100 scale-[6]"><Cpu /></div>
                            </div>
                        </div>
                    </section>
                </div>
            );
        };

        // ==========================================
        // MAIN APP ORCHESTRATOR
        // ==========================================
        const App = () => {
            const [view, setView] = React.useState('landing');
            const [currentUser, setCurrentUser] = React.useState(null);
            const [auth, setAuth] = React.useState(null);
            
            const handleAuthSuccess = (userData, creds) => {
                setCurrentUser(userData);
                setAuth(creds);
                setView('dashboard');
            };

            const handleLogout = () => {
                setCurrentUser(null);
                setAuth(null);
                setView('landing');
            };

            return (
                <React.Fragment>
                    {view === 'landing' && <LandingPage onSignUp={() => setView('signup')} onLogin={() => setView('login')} />}
                    {view === 'login' && <LoginPage onBack={() => setView('landing')} onSuccess={handleAuthSuccess} />}
                    {view === 'signup' && <SignUpPage onBack={() => setView('landing')} onSuccess={handleAuthSuccess} />}
                    {view === 'dashboard' && currentUser && ( <Dashboard user={currentUser} auth={auth} onLogout={handleLogout} /> )}
                </React.Fragment>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
