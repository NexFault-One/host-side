line-length = 88

[lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "UP", # pyupgrade
]
exclude = [
    "**/gui/**", # gui must be updated manually
    "**/protobuf_msgs/**", # protobuf is autogenerated
]
ignore = []

[lint.per-file-ignores]
"__init__.py" = ["F401"]